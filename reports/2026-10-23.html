<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#ddd;--accent:#2a78d6;--bad:#c62828}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}

label{display:flex;align-items:center;gap:6px;margin:12px 0;font-size:14px;color:var(--muted)}
button{width:100%;padding:10px;font-size:16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}
</style></head><body>

  document.open(); document.write(html); document.close();
}
const enc = raw => btoa(String.fromCharCode(...raw));
function stored() {
  for (const s of [sessionStorage, localStorage]) {
    try { const v = JSON.parse(s.getItem(STORE) || "null"); if (v && (!v.exp || v.exp > Date.now())) return b64(v.k); } catch (e) { }
  }
  return null;
}
function forget() { for (const s of [sessionStorage, localStorage]) try { s.removeItem(STORE); } catch (e) { } }
(async () => {
  if (/[?&]logout\b/.test(location.search)) { forget(); history.replaceState(null, "", location.pathname); }
  const raw = stored();
  if (raw) { const html = await unlock(raw); if (html) return show(html); forget(); }   // password changed: ask again
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.textContent = "";
    const raw = await derive(document.getElementById("pw").value);
    const html = await unlock(raw);
    go.disabled = false;

    const v = JSON.stringify({k: enc(raw), exp: Date.now() + DAYS * 864e5});
    try { sessionStorage.setItem(STORE, v); if (document.getElementById("rem").checked) localStorage.setItem(STORE, v); } catch (e) { }
    show(html);
  };
})();
