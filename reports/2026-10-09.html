<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#ddd;--accent:#2a78d6;--bad:#c62828}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}

label{display:flex;align-items:center;gap:6px;margin:12px 0;font-size:14px;color:var(--muted)}
button{width:100%;padding:10px;font-size:16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}
</style></head><body>

const STORE = "amazi_site_key", DAYS = 30;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: hex(SALT), iterations: ROUNDS, hash: "SHA-256"}, base, 256));
}
async function unlock(raw) {   // the full version first, then the staff one
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  for (const box of BOXES) {
    const b = b64(box);
    try { return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b.slice(0, 12)}, key, b.slice(12))); }
    catch (e) { }
  }
  return null;
}
async function show(html) {   // replace the login screen only once it has loaded (else the page is appended to it)

}
const enc = raw => btoa(String.fromCharCode(...raw));
function stored() {

function forget() { for (const s of [sessionStorage, localStorage]) try { s.removeItem(STORE); } catch (e) { } }
