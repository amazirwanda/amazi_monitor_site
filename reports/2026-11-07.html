<title>Amazi 每日电池检查</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#ddd;--accent:#2a78d6;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--card:#262624;--text:#eee;--muted:#a3a39c;--line:#3a3a37;--accent:#5b9cf0;--bad:#ef6b6b}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(320px,calc(100vw - 32px));box-sizing:border-box}
h1{font-size:18px;margin:0 0 6px}p{margin:0 0 16px;color:var(--muted);font-size:14px}
input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
label{display:flex;align-items:center;gap:6px;margin:12px 0;font-size:14px;color:var(--muted)}
button{width:100%;padding:10px;font-size:16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#err{color:var(--bad);font-size:14px;min-height:20px;margin:10px 0 0}
</style></head><body>

const STORE = "amazi_site_key", DAYS = 30;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: hex(SALT), iterations: ROUNDS, hash: "SHA-256"}, base, 256));
}
async function unlock(raw) {   // the full version first, then the staff one
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  for (const box of BOXES) {
    const b = b64(box);
    try { return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b.slice(0, 12)}, key, b.slice(12))); }
    catch (e) { }
  }
  return null;
}
async function show(html) {   // replace the login screen only once it has loaded (else the page is appended to it)
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}
const enc = raw => btoa(String.fromCharCode(...raw));
function stored() {
  for (const s of [sessionStorage, localStorage]) {
    try { const v = JSON.parse(s.getItem(STORE) || "null"); if (v && (!v.exp || v.exp > Date.now())) return b64(v.k); } catch (e) { }
  }
  return null;
}
function forget() { for (const s of [sessionStorage, localStorage]) try { s.removeItem(STORE); } catch (e) { } }
(async () => {

  const raw = stored();
  if (raw) { const html = await unlock(raw); if (html) return show(html); forget(); }   // password changed: ask again
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const go = document.getElementById("go"), err = document.getElementById("err");
    go.disabled = true; err.textContent = "";
    const raw = await derive(document.getElementById("pw").value);
    const html = await unlock(raw);
    go.disabled = false;
    if (!html) { err.textContent = "密码不对"; return; }
    const v = JSON.stringify({k: enc(raw), exp: Date.now() + DAYS * 864e5});
    try { sessionStorage.setItem(STORE, v); if (document.getElementById("rem").checked) localStorage.setItem(STORE, v); } catch (e) { }
    show(html);
  };
})();
